<div class="panels">
  <app-editor-panel
    class="panel"
    [side]="'left'"
    [expanded]="expanded()"
    [hideSame]="hideSame()"
    [selected]="selectedKey()"
    (toggleExpand)="onToggleExpand($event)"
    (select)="onSelect($event)"
  />
  <app-diff-controls
    [count]="count()"
    [position]="position()"
    [hideSame]="hideSame()"
    (prev)="prev()"
    (next)="next()"
    (hideSameChange)="hideSame.set($event)"
    (formatDocuments)="formatAll()"
  />
  <app-editor-panel
    class="panel"
    [side]="'right'"
    [expanded]="expanded()"
    [hideSame]="hideSame()"
    [selected]="selectedKey()"
    (toggleExpand)="onToggleExpand($event)"
    (select)="onSelect($event)"
  />
</div>

<div class="statusbar">
  @if (selectedDisplay()) {
    <span class="path">{{ selectedDisplay() }}</span>
  } @else {
    <span class="hint">Click a node to see its path</span>
  }
</div>
